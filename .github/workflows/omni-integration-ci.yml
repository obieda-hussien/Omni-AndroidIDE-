name: Omni Integration Compile

on:
  pull_request:
    branches: [dev]
    paths:
      - "core/app/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/omni-integration-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omni-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-core-app:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Compile AndroidIDE app Kotlin and generated IPC
        run: ./gradlew :core:app:compileDebugKotlin --stacktrace --no-daemon --max-workers=2
