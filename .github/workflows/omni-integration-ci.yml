name: Omni Integration Compile

on:
  pull_request:
    branches: [dev]
    paths:
      - "core/app/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/omni-integration-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omni-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-core-app:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: adopt
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew .github/scripts/fetch-omnilink.sh

      - name: Stage OmniLinkSDK with retry/backoff
        run: bash .github/scripts/fetch-omnilink.sh

      - name: Compile AndroidIDE app Kotlin and generated IPC
        run: ./gradlew :core:app:compileDebugKotlin --stacktrace --no-daemon --max-workers=2
